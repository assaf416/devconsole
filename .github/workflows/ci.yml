name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  cucumber:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run Cucumber with coverage
        run: CUCUMBER_PUBLISH_QUIET=true bundle exec cucumber

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Build coverage summary
        if: always()
        id: coverage
        shell: bash
        run: |
          if [[ -f coverage/coverage.json ]]; then
            metrics=$(ruby -rjson -e '
              j = JSON.parse(File.read("coverage/coverage.json"))
              total = 0
              covered = 0
              j.fetch("coverage", {}).each_value do |file_data|
                Array(file_data["lines"]).each do |v|
                  next if v.nil?
                  total += 1
                  covered += 1 if v.to_i > 0
                end
              end
              percent = total.zero? ? 0.0 : ((covered.to_f / total) * 100).round(2)
              puts [percent, covered, total].join(" ")
            ')
            covered_percent=$(echo "$metrics" | awk '{print $1}')
            covered_lines=$(echo "$metrics" | awk '{print $2}')
            total_lines=$(echo "$metrics" | awk '{print $3}')
            {
              echo "summary<<EOF"
              echo "## CI Test Results"
              echo "- Cucumber: passed"
              echo ""
              echo "## Coverage"
              echo "- Line coverage: ${covered_percent}%"
              echo "- Covered lines: ${covered_lines}/${total_lines}"
              echo ""
              echo "Coverage artifacts are attached to this workflow run."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "summary<<EOF"
              echo "## CI Test Results"
              echo "- Cucumber: finished"
              echo ""
              echo "## Coverage"
              echo "Coverage file not generated."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- devconsole-ci-coverage -->';
            const summary = `${{ steps.coverage.outputs.summary }}`;
            const body = `${marker}\n${summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
